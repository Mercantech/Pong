<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PONG – Multiplayer</title>
  <script>
    (function () {
      var m = location.pathname.match(/^(\/Pong)(?=\/|$)/i);
      if (!m) return;
      var base = document.createElement('base');
      base.href = m[1] + '/';
      document.currentScript.after(base);
      if (location.pathname === m[1]) {
        location.replace(m[1] + '/' + location.search + location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="arena-nav.css?v=1">
</head>
<body>
  <script src="arena-nav.js?v=1"></script>
  <div id="app">
    <div id="join-screen">
      <p class="hero-kicker">Mercantec Games</p>
      <h1>PONG</h1>
      <p class="tagline">Classic / Arcade · PIN-lobby · menneske eller CPU</p>

      <div class="lobby-panels">
        <section class="lobby-panel">
          <h2>Opret spil</h2>
          <label class="field-label" for="create-name">Dit navn</label>
          <input type="text" id="create-name" placeholder="Navn" maxlength="20" autocomplete="nickname">
          <label class="field-label" for="create-pin">PIN (valgfri — fx Arduino)</label>
          <input type="text" id="create-pin" placeholder="Tom = tilfældig" maxlength="8" autocomplete="off" inputmode="numeric">
          <fieldset class="mode-picker">
            <legend>Mode</legend>
            <label><input type="radio" name="game-mode" value="classic" checked> Classic</label>
            <label><input type="radio" name="game-mode" value="arcade"> Arcade</label>
          </fieldset>
          <label class="check-row">
            <input type="checkbox" id="create-ai" checked>
            Spil mod CPU
          </label>
          <label class="field-label" for="ai-difficulty">CPU-sværhedsgrad</label>
          <select id="ai-difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
          <button id="btn-create-lobby" type="button" class="btn-primary">Opret spil</button>
        </section>

        <section class="lobby-panel">
          <h2>Join med PIN</h2>
          <label class="field-label" for="name-input">Dit navn</label>
          <input type="text" id="name-input" placeholder="Navn (valgfri)" maxlength="20" autocomplete="nickname">
          <label class="field-label" for="pin-input">PIN</label>
          <input type="text" id="pin-input" placeholder="1234" maxlength="8" autocomplete="off" inputmode="numeric">
          <button id="btn-join" type="button" class="btn-primary">Join spil</button>
        </section>
      </div>

      <p id="join-error" class="join-error hidden"></p>

      <section class="open-lobbies">
        <div class="open-lobbies-head">
          <h2>Åbne lobbies</h2>
          <button type="button" id="btn-refresh-lobbies" class="btn-ghost">Opdater</button>
        </div>
        <div id="open-lobby-list"></div>
        <p id="no-open-lobbies" class="muted">Ingen åbne lobbies — opret et spil!</p>
      </section>

      <nav class="home-links">
        <a href="admin.html">Lærer-værktøj</a>
      </nav>
    </div>

    <div id="game-screen" class="hidden">
      <header class="game-header">
        <div>
          <h1>PONG</h1>
          <p id="lobby-pin" class="lobby-pin"></p>
        </div>
        <div id="status">Forbinder…</div>
        <div class="header-controls">
          <button id="btn-toggle-ai" type="button" class="btn-secondary hidden">Tilføj CPU</button>
          <button id="btn-start" type="button" disabled>Start spil</button>
          <button id="btn-reset" type="button" disabled>Nyt spil</button>
          <button id="btn-leave" type="button" class="btn-ghost">Forlad</button>
        </div>
      </header>

      <div class="tv-frame">
        <div class="score-bar">
          <div>
            <div class="player-label" id="label-left">VENSTRE</div>
            <span id="score-left">0</span>
          </div>
          <div style="font-size:0.5rem;color:#666">FØRST TIL 11</div>
          <div style="text-align:right">
            <div class="player-label" id="label-right">HØJRE</div>
            <span id="score-right">0</span>
          </div>
        </div>
        <div class="tv-bezel">
          <div class="court-wrap">
            <canvas id="pong-canvas" width="800" height="450"></canvas>
            <div id="overlay" class="overlay hidden">
              <div class="overlay-box">
                <h2 id="overlay-title">Venter</h2>
                <p id="overlay-text"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p id="player-info" class="player-info"></p>
      <p id="controls-hint" class="controls-hint"></p>
      <div id="power-hud" class="power-hud hidden"></div>
    </div>
  </div>
  <script src="client.js?v=3"></script>
</body>
</html>
